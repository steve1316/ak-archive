# Serving an archive from the root, for the Docker image and local previews. GitHub Pages does not use this - it has no rewrite rules, which is
# what `spaFallback()` works around instead.

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# Vite fingerprints these, so they can be cached indefinitely.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# If the app serves anything Vite does not fingerprint, such as a vendored runtime under /vendor/, give it its own block with a shorter
	# life. An immutable year on an unfingerprinted file is how a stale copy gets pinned in readers' caches.

	# Local copies of the art and the story, mounted by the `docker-compose.local-*.yml` overrides. Their own blocks keep a missing file a 404,
	# not the app.
	location /ak-assets/ {
		expires 7d;
	}

	location /ak-story/ {
		expires 7d;
	}

	# Routes are real paths, so anything that is not a file falls back to the app and the router renders it.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
